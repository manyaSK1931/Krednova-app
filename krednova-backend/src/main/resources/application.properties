spring.application.name=krednova-payroll
spring.profiles.default=local
server.port=${PORT:8080}
# Production-style defaults: MySQL, secrets from environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/krednova?serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:krednova}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
# Session cookie: not readable by scripts, only sent over HTTPS, not sent on cross-site requests.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=KNSESSION
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
krednova.timezone=Asia/Kolkata
krednova.shift-start=09:00
krednova.grace-minutes=10
# Behind a reverse proxy (nginx etc.) that is the ONLY way to reach this server, enable the next line so rate limiting sees real client IPs.
# server.forward-headers-strategy=native

# ---- Speed / hosting ----
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
server.shutdown=graceful
spring.main.banner-mode=off
spring.jmx.enabled=false
# Keep database connections alive (managed MySQL such as Aiven closes idle ones) and retry if the DB is still waking up.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1500000
spring.flyway.connect-retries=5
# Sign-in attempts allowed per minute per IP. Behind Vercel + Render many people share one IP, so raise it there (e.g. 30).
krednova.login-rate-limit=${KREDNOVA_LOGIN_RATE_LIMIT:10}
