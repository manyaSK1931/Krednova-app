# Default local profile: a database file kept in ./data, so your accounts and data survive restarts.
# No demo accounts. On first start the website asks you to create the administrator account.
spring.datasource.url=jdbc:h2:file:./data/krednova;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
server.servlet.session.cookie.secure=false
